<!DOCTYPE html>
<html>
<head>
<style>
  .btn {
    background-color: #1e3a8a;
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    /* Define the transition */
    transition: background-color 0.4s ease, transform 0.3s ease;
  }
  .btn:hover {
    background-color: #06b6d4;
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <button class="btn">Hover Me</button>
</body>
</html>
